<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 28" width="100%" height="28">
  <defs>
    <linearGradient id="hh-div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="20%" stop-color="#451126" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#451126" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>

    <filter id="hh-div-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Accent Divider Line -->
  <line x1="40" y1="14" x2="880" y2="14" stroke="url(#hh-div-grad)" stroke-width="1.2" />

  <!-- Center Diamond & Accents -->
  <g transform="translate(460, 14)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#C77B9B" filter="url(#hh-div-glow)" />
    <circle cx="0" cy="0" r="1.5" fill="#F8F0F3" />
    <circle cx="-16" cy="0" r="2" fill="#701A3D" />
    <circle cx="16" cy="0" r="2" fill="#701A3D" />
  </g>
</svg>
