<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 110" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hh-foot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Top Border Line Gradient -->
    <linearGradient id="hh-foot-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>

    <!-- Moving Glow Pulse Gradient -->
    <linearGradient id="hh-foot-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0" />
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0" />
    </linearGradient>

    <filter id="hh-foot-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .hh-mono {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      }
      .hh-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="916" height="106" rx="14" fill="url(#hh-foot-bg)" stroke="#451126" stroke-width="1.2" />

  <!-- Top Accent Horizon Line -->
  <line x1="40" y1="2" x2="880" y2="2" stroke="url(#hh-foot-border)" stroke-width="2" />

  <!-- Moving Pulse on Horizon -->
  <circle cx="460" cy="2" r="3" fill="#F8F0F3" filter="url(#hh-foot-glow)">
    <animate attributeName="cx" values="100;820;100" dur="8s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Center Signature and Content -->
  <g transform="translate(460, 42)" text-anchor="middle">
    <!-- Center Pulsing Indicator -->
    <circle cx="0" cy="-14" r="3.5" fill="#C77B9B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="-14" r="8" fill="none" stroke="#C77B9B" stroke-width="0.7">
      <animate attributeName="r" values="5;12;5" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Headline -->
    <text x="0" y="8" fill="#F8F0F3" font-size="14" font-weight="700" letter-spacing="3" class="hh-sans">
      ENGINEERED WITH RIGOR · DESIGNED IN BURGUNDY
    </text>

    <!-- Subtitle -->
    <text x="0" y="32" fill="#E5B5C7" font-size="11" font-weight="500" letter-spacing="2" class="hh-mono" opacity="0.85">
      HITESH CHUGH · ARTIFICIAL INTELLIGENCE &amp; FULL-STACK SYSTEMS · 2026
    </text>

    <!-- Status Code Line -->
    <text x="0" y="52" fill="#C77B9B" font-size="9.5" font-weight="400" letter-spacing="1.5" class="hh-mono" opacity="0.65">
      SYS_INTEGRITY: 100% · END-OF-TRANSMISSION · ALL NODES SECURE
    </text>
  </g>
</svg>
