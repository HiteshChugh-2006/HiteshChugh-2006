<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hh-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="hh-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#451126" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Name Typography Gradient -->
    <linearGradient id="hh-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3" />
      <stop offset="70%" stop-color="#F8F0F3" />
      <stop offset="100%" stop-color="#E5B5C7" />
    </linearGradient>

    <!-- Shimmer Underline Gradient -->
    <linearGradient id="hh-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0" />
    </linearGradient>

    <!-- Moving Wave Gradient -->
    <linearGradient id="hh-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="hh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hh-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Fine Technical Grid -->
    <pattern id="hh-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#C77B9B" stroke-width="0.75" stroke-opacity="0.04" />
      <circle cx="28" cy="28" r="0.75" fill="#C77B9B" fill-opacity="0.12" />
    </pattern>

    <style>
      .hh-mono {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      }
      .hh-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        .hh-animated {
          animation: none !important;
          stroke-dasharray: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Container -->
  <rect x="2" y="2" width="916" height="316" rx="16" fill="url(#hh-bg-grad)" stroke="url(#hh-border-grad)" stroke-width="1.5" />

  <!-- Grid Layer -->
  <rect x="3" y="3" width="914" height="314" rx="15" fill="url(#hh-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="120" r="130" fill="#701A3D" opacity="0.25" filter="url(#hh-soft-glow)">
    <animate attributeName="opacity" values="0.18;0.32;0.18" dur="7s" repeatCount="indefinite" />
    <animate attributeName="r" values="120;140;120" dur="7s" repeatCount="indefinite" />
  </circle>

  <circle cx="780" cy="160" r="140" fill="#451126" opacity="0.3" filter="url(#hh-soft-glow)">
    <animate attributeName="opacity" values="0.22;0.38;0.22" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Orbital Geometry System (Right Side) -->
  <g transform="translate(760, 155)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#701A3D" stroke-width="1" stroke-dasharray="4 8" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite" />
    </circle>

    <!-- Mid Ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#C77B9B" stroke-width="1" stroke-dasharray="6 6" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="36s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#E5B5C7" stroke-width="1.2" opacity="0.22" />

    <!-- Orbital Crosshairs -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#451126" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#451126" stroke-width="1" opacity="0.4" />

    <!-- Satellite 1 (Outer Orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
      <circle cx="110" cy="0" r="3.5" fill="#C77B9B" filter="url(#hh-glow)" />
      <circle cx="110" cy="0" r="7" fill="none" stroke="#C77B9B" stroke-width="0.8" opacity="0.5">
        <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Satellite 2 (Mid Orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="12s" repeatCount="indefinite" />
      <circle cx="75" cy="0" r="2.5" fill="#E5B5C7" />
    </g>

    <!-- Satellite 3 (Inner Orbit) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="8s" repeatCount="indefinite" />
      <circle cx="45" cy="0" r="2" fill="#F8F0F3" />
    </g>

    <!-- Core Node -->
    <circle cx="0" cy="0" r="7" fill="#701A3D" stroke="#C77B9B" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#F8F0F3" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#C77B9B" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="9;20;9" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Side: Content Hierarchy -->

  <!-- 1. Status Pill Badge -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="372" height="28" rx="14" fill="#190B12" stroke="#451126" stroke-width="1" />
    
    <!-- Pulsing Live Radar Indicator -->
    <circle cx="16" cy="14" r="4" fill="#C77B9B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="16" cy="14" r="7" fill="none" stroke="#C77B9B" stroke-width="0.8">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Pill Text -->
    <text x="32" y="18" fill="#E5B5C7" font-size="11" font-weight="600" letter-spacing="1.5" class="hh-mono">
      AI &amp; ML SYSTEMS · CHANDIGARH UNIVERSITY
    </text>
  </g>

  <!-- 2. Primary Name Header -->
  <g transform="translate(48, 122)">
    <text x="0" y="0" fill="url(#hh-text-grad)" font-size="46" font-weight="800" letter-spacing="1.2" class="hh-sans">
      HITESH CHUGH
    </text>
  </g>

  <!-- 3. Glowing Underline with Animated Shimmer -->
  <g transform="translate(48, 138)">
    <!-- Baseline track -->
    <line x1="0" y1="0" x2="420" y2="0" stroke="#451126" stroke-width="2" stroke-linecap="round" />
    
    <!-- Moving luminous shimmer -->
    <line x1="0" y1="0" x2="160" y2="0" stroke="url(#hh-shimmer)" stroke-width="2.8" stroke-linecap="round" class="hh-animated">
      <animate attributeName="x1" values="0;280;0" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="140;420;140" dur="4.5s" repeatCount="indefinite" />
    </line>

    <!-- Terminal accent bead -->
    <circle cx="420" cy="0" r="2.5" fill="#C77B9B" />
  </g>

  <!-- 4. Positioning and Role Typography -->
  <g transform="translate(48, 175)">
    <text x="0" y="0" fill="#F8F0F3" font-size="19" font-weight="600" letter-spacing="0.4" class="hh-sans">
      AI/ML Engineer <tspan fill="#C77B9B" font-weight="400">|</tspan> Full-Stack Systems <tspan fill="#C77B9B" font-weight="400">|</tspan> Predictive Architect
    </text>
    <text x="0" y="24" fill="#C77B9B" font-size="13.5" font-weight="400" letter-spacing="0.3" class="hh-sans">
      Engineering intelligent deep learning models, scalable backends &amp; high-performance web applications.
    </text>
  </g>

  <!-- 5. Animated Sine Trace Wave -->
  <path d="M 48 245 C 130 232, 190 258, 270 245 C 350 232, 410 258, 490 245 C 570 232, 630 258, 710 245 C 790 232, 830 255, 872 245"
        fill="none"
        stroke="url(#hh-wave-grad)"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-dasharray="6 8"
        class="hh-animated">
    <animate attributeName="stroke-dashoffset" values="0;-56" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- 6. Bottom Technical Telemetry Bar -->
  <g transform="translate(48, 286)">
    <!-- Left telemetry -->
    <text x="0" y="0" fill="#E5B5C7" font-size="11" font-weight="500" letter-spacing="1.2" class="hh-mono" opacity="0.88">
      <tspan fill="#701A3D">[</tspan>CGPA: 8.45<tspan fill="#701A3D">]</tspan>  ·  <tspan fill="#701A3D">[</tspan>STATUS: OPERATIONAL<tspan fill="#701A3D">]</tspan>  ·  <tspan fill="#701A3D">[</tspan>FOCUS: DEEP LEARNING &amp; CLOUD NATIVE<tspan fill="#701A3D">]</tspan>
    </text>

    <!-- Right telemetry coordinates -->
    <text x="824" y="0" text-anchor="end" fill="#C77B9B" font-size="11" font-weight="500" letter-spacing="1.4" class="hh-mono" opacity="0.75">
      LAT 30.73° N · LON 76.77° E // SYS.2026
    </text>
  </g>
</svg>
